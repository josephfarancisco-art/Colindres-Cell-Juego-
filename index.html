<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#03070a">

<title>COLINDRES CELL — Combat Arena</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020407;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

body {
    position: fixed;
    inset: 0;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#splash {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0, 188, 255, .14),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #020406,
            #071118,
            #020305
        );

    transition:
        opacity .9s ease,
        visibility .9s ease;
}

#splash::before {

    content: "";

    position: absolute;
    inset: 0;

    opacity: .11;

    background-image:
        linear-gradient(
            rgba(255,255,255,.15) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.15) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    transform:
        perspective(500px)
        rotateX(58deg)
        scale(1.6);

    transform-origin: center bottom;
}

#splash.hidden {

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-content {

    position: relative;
    z-index: 2;

    width: min(90vw, 480px);

    text-align: center;

    padding: 35px 20px;
}

.logo-box {

    width: min(82vw, 330px);
    height: 105px;

    margin: 0 auto 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    filter:
        drop-shadow(
            0 0 20px
            rgba(0, 213, 255, .35)
        );
}

.logo-box img {

    width: 100%;
    max-height: 100%;

    object-fit: contain;
}

.brand-fallback {

    display: none;

    color: white;

    font-family:
        Impact,
        Arial Black,
        sans-serif;

    font-size:
        clamp(30px, 9vw, 54px);

    letter-spacing: 4px;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 25px #00d9ff;
}

.tagline {

    margin-bottom: 38px;

    color: #a6b6c0;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.start-button,
.restart-button {

    position: relative;

    overflow: hidden;

    width: min(84vw, 360px);

    min-height: 66px;

    border-radius: 14px;

    border:
        1px solid
        rgba(0, 225, 255, .8);

    background:
        linear-gradient(
            135deg,
            rgba(0, 225, 255, .18),
            rgba(0, 80, 110, .36)
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 0 18px
        rgba(0, 220, 255, .35),

        inset 0 0 25px
        rgba(0, 220, 255, .08);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.start-button::before,
.restart-button::before {

    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.38),
            transparent
        );

    transform: skewX(-25deg);

    animation:
        buttonShine 2.8s infinite;
}

@keyframes buttonShine {

    0% {
        left: -100%;
    }

    45%,
    100% {
        left: 150%;
    }
}

.start-button:active,
.restart-button:active {

    transform: scale(.96);

    box-shadow:
        0 0 35px
        rgba(0, 220, 255, .75);
}

#hud {

    position: fixed;
    inset: 0;

    z-index: 50;

    display: none;

    pointer-events: none;
}

#topHud {

    position: absolute;

    top:
        max(
            15px,
            env(safe-area-inset-top)
        );

    left: 15px;
    right: 15px;

    display: flex;

    gap: 10px;

    align-items: center;
}

.hud-card {

    border:
        1px solid
        rgba(130,220,255,.18);

    background:
        rgba(4,9,13,.74);

    border-radius: 10px;

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);
}

.health-card {

    flex: 1;

    padding: 9px 11px;
}

.health-title {

    display: flex;

    justify-content: space-between;

    color: #b7c6cd;

    font-size: 10px;

    letter-spacing: 1px;

    margin-bottom: 5px;
}

.health-bar {

    width: 100%;

    height: 10px;

    overflow: hidden;

    border-radius: 99px;

    background:
        rgba(255,255,255,.08);
}

#healthFill {

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #16e987,
            #baff5e
        );

    box-shadow:
        0 0 10px
        rgba(40,255,150,.45);

    transition:
        width .2s ease,
        background .2s ease;
}

.stat-card {

    min-width: 82px;

    padding: 9px 12px;

    text-align: center;
}

.stat-label {

    color: #81929d;

    font-size: 9px;

    letter-spacing: 2px;
}

.stat-value {

    color: white;

    font-family:
        Impact,
        Arial Black,
        sans-serif;

    font-size: 22px;
}

#waveIndicator {

    position: absolute;

    top: 86px;

    left: 50%;

    transform: translateX(-50%);

    padding: 8px 18px;

    border-radius: 99px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.38);

    color: #b9c7ce;

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;
}

#ammo {

    position: absolute;

    right: 18px;

    bottom: 150px;

    padding: 7px 12px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.45);

    color: #d8e7ed;

    font-family:
        Impact,
        Arial Black,
        sans-serif;

    letter-spacing: 2px;

    font-size: 17px;
}

#crosshair {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 34px;
    height: 34px;

    transform:
        translate(-50%, -50%);

    opacity: .85;
}

#crosshair::before,
#crosshair::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.9);
}

#crosshair::before {

    width: 2px;
    height: 34px;

    left: 16px;
    top: 0;
}

#crosshair::after {

    width: 34px;
    height: 2px;

    left: 0;
    top: 16px;
}

.cross-dot {

    position: absolute;

    width: 5px;
    height: 5px;

    left: 14.5px;
    top: 14.5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white;
}

#joystick {

    position: absolute;

    left:
        max(
            22px,
            env(safe-area-inset-left)
        );

    bottom:
        max(
            24px,
            env(safe-area-inset-bottom)
        );

    width: 140px;
    height: 140px;

    border-radius: 50%;

    border:
        2px solid
        rgba(180,230,245,.22);

    background:
        rgba(20,35,43,.28);

    box-shadow:
        inset 0 0 25px
        rgba(0,0,0,.35);

    pointer-events: auto;
}

#joystick::before {

    content: "";

    position: absolute;

    inset: 17px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(170,220,240,.18);
}

#joystickKnob {

    position: absolute;

    width: 62px;
    height: 62px;

    left: 37px;
    top: 37px;

    border-radius: 50%;

    border:
        2px solid
        rgba(180,245,255,.55);

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.22),
            transparent 30%
        ),
        rgba(50,170,205,.42);

    box-shadow:
        0 0 20px
        rgba(0,210,255,.28),

        inset 0 0 15px
        rgba(255,255,255,.1);
}

#lookArea {

    position: absolute;

    right: 0;

    top: 18%;

    width: 58%;
    height: 52%;

    pointer-events: auto;
}

#fireButton {

    position: absolute;

    right:
        max(
            24px,
            env(safe-area-inset-right)
        );

    bottom:
        max(
            34px,
            env(safe-area-inset-bottom)
        );

    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.55);

    background:
        radial-gradient(
            circle,
            rgba(255,65,50,.78),
            rgba(100,10,10,.45)
        );

    color: white;

    font-size: 40px;

    pointer-events: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 25px
        rgba(255,35,20,.4);

    cursor: pointer;
}

#fireButton:active {

    transform: scale(.90);

    box-shadow:
        0 0 45px
        rgba(255,35,20,.9);
}

#damageFlash {

    position: fixed;

    inset: 0;

    z-index: 80;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 32%,
            rgba(255,0,0,.76)
        );

    opacity: 0;
}

#damageFlash.hit {

    animation:
        damage .35s ease-out;
}

@keyframes damage {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

#message {

    position: absolute;

    top: 38%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Impact,
        Arial Black,
        sans-serif;

    font-size:
        clamp(26px, 8vw, 52px);

    letter-spacing: 5px;

    text-shadow:
        0 0 20px
        rgba(0,220,255,.7);

    opacity: 0;

    transition:
        opacity .3s ease;

    white-space: nowrap;
}

#gameOver {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.78);

    backdrop-filter: blur(9px);

    -webkit-backdrop-filter: blur(9px);
}

.game-over-panel {

    width: min(88vw,430px);

    padding: 35px 22px;

    text-align: center;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,60,50,.35);

    background:
        linear-gradient(
            145deg,
            rgba(13,20,25,.97),
            rgba(3,7,10,.97)
        );

    box-shadow:
        0 0 50px
        rgba(0,0,0,.7);
}

.game-over-title {

    margin-bottom: 8px;

    color: #ff5048;

    font-family:
        Impact,
        Arial Black,
        sans-serif;

    font-size:
        clamp(38px,12vw,60px);

    letter-spacing: 5px;

    text-shadow:
        0 0 20px
        rgba(255,40,30,.5);
}

.final-score {

    margin:
        12px 0 28px;

    color: #c7d3d9;

    letter-spacing: 2px;
}

#finalKills {

    display: inline-block;

    margin-top: 5px;

    color: white;

    font-size: 38px;

    font-weight: 900;
}

.restart-button {

    width: 100%;
}

@media (max-width:500px) {

    #joystick {

        width: 124px;
        height: 124px;
    }

    #joystickKnob {

        width: 56px;
        height: 56px;

        left: 32px;
        top: 32px;
    }

    #fireButton {

        width: 88px;
        height: 88px;

        font-size: 33px;
    }

    .stat-card {

        min-width: 72px;
    }

    #ammo {

        bottom: 137px;
    }
}

@media (orientation:landscape) {

    #lookArea {

        width: 48%;
        height: 65%;
        top: 15%;
    }

    #waveIndicator {

        top: 75px;
    }
}

</style>
</head>

<script type="module">

import * as THREE from "three";

/* =========================================================
   ELEMENTOS DE INTERFAZ
========================================================= */

const canvas =
    document.getElementById("game");

const splash =
    document.getElementById("splash");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const hud =
    document.getElementById("hud");

const gameOver =
    document.getElementById("gameOver");

const healthFill =
    document.getElementById("healthFill");

const healthText =
    document.getElementById("healthText");

const killsText =
    document.getElementById("kills");

const finalKills =
    document.getElementById("finalKills");

const waveIndicator =
    document.getElementById("waveIndicator");

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById("joystickKnob");

const fireButton =
    document.getElementById("fireButton");

const lookArea =
    document.getElementById("lookArea");

const damageFlash =
    document.getElementById("damageFlash");

const message =
    document.getElementById("message");


/* =========================================================
   MOTOR
========================================================= */

let renderer;
let scene;
let camera;
let clock;

let player;
let weapon;
let playerMuzzleLight;

let gameRunning = false;
let gameStarted = false;

let playerHealth = 100;
let kills = 0;
let wave = 1;

let shootCooldown = 0;
let enemySpawnTimer = 0;

let cameraYaw = Math.PI;
let cameraPitch = 0.28;

let moveX = 0;
let moveY = 0;

let joystickPointerId = null;
let lookPointerId = null;

let lookLastX = 0;
let lookLastY = 0;

const WORLD_SIZE = 90;

const enemies = [];
const playerBullets = [];
const enemyBullets = [];
const particles = [];
const obstacles = [];
const effects = [];

const raycaster = new THREE.Raycaster();


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;
let ambientStarted = false;

function initializeAudio() {

    if (audioContext) {
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.22;

    masterGain.connect(
        audioContext.destination
    );

    startAmbient();
}

function resumeAudio() {

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {
        audioContext.resume();
    }
}

function createTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.15,
    endFrequency = null
) {

    if (!audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    if (endFrequency !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(20, endFrequency),
            audioContext.currentTime + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration +
        0.02
    );
}

function playPlayerShot() {

    createTone(
        180,
        0.09,
        "sawtooth",
        0.20,
        70
    );

    createTone(
        800,
        0.035,
        "square",
        0.08,
        260
    );
}

function playEnemyShot() {

    createTone(
        110,
        0.13,
        "square",
        0.16,
        45
    );

    createTone(
        420,
        0.06,
        "sawtooth",
        0.06,
        120
    );
}

function playImpactSound() {

    createTone(
        1000,
        0.05,
        "square",
        0.08,
        250
    );
}

function playDamageSound() {

    createTone(
        90,
        0.22,
        "sawtooth",
        0.20,
        35
    );
}

function playDeathSound() {

    createTone(
        300,
        0.4,
        "sawtooth",
        0.20,
        40
    );

    setTimeout(() => {

        createTone(
            80,
            0.28,
            "triangle",
            0.12,
            30
        );

    }, 80);
}

function playPlayerDeathSound() {

    createTone(
        180,
        0.75,
        "sawtooth",
        0.25,
        28
    );

    setTimeout(() => {

        createTone(
            55,
            0.5,
            "square",
            0.12,
            25
        );

    }, 130);
}

function startAmbient() {

    if (
        ambientStarted ||
        !audioContext
    ) {
        return;
    }

    ambientStarted = true;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 48;

    gain.gain.value = 0.018;

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();
}


/* =========================================================
   RENDERER
========================================================= */

function initializeRenderer() {

    renderer =
        new THREE.WebGLRenderer({
            canvas,
            antialias: false,
            powerPreference:
                "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.12;

    renderer.shadowMap.enabled = false;
}


/* =========================================================
   ESCENA
========================================================= */

function initializeScene() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x05080b
        );

    scene.fog =
        new THREE.FogExp2(
            0x071015,
            0.017
        );

    camera =
        new THREE.PerspectiveCamera(
            64,
            window.innerWidth /
            window.innerHeight,
            0.1,
            250
        );

    clock =
        new THREE.Clock();

    const hemisphere =
        new THREE.HemisphereLight(
            0x9edcff,
            0x101419,
            1.2
        );

    scene.add(
        hemisphere
    );

    const directional =
        new THREE.DirectionalLight(
            0xb8e7ff,
            1.6
        );

    directional.position.set(
        -30,
        45,
        -20
    );

    scene.add(
        directional
    );

    const centerLight =
        new THREE.PointLight(
            0x00d9ff,
            18,
            55
        );

    centerLight.position.set(
        0,
        5,
        0
    );

    scene.add(
        centerLight
    );

    createArena();
    createObstacles();
    createPlayer();
}


/* =========================================================
   ARENA
========================================================= */

function createArena() {

    const floorGeometry =
        new THREE.PlaneGeometry(
            WORLD_SIZE * 2,
            WORLD_SIZE * 2
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x10171b,
            roughness: .88,

/* =========================================================
   COLISIÓN CORRECTA
========================================================= */

function circleIntersectsRotatedBox(
    x,
    z,
    radius,
    obstacle
) {

    const dx =
        x -
        obstacle.mesh.position.x;

    const dz =
        z -
        obstacle.mesh.position.z;

    const cosine =
        Math.cos(
            -obstacle.angle
        );

    const sine =
        Math.sin(
            -obstacle.angle
        );

    const localX =
        dx * cosine -
        dz * sine;

    const localZ =
        dx * sine +
        dz * cosine;

    const halfWidth =
        obstacle.width / 2;

    const halfDepth =
        obstacle.depth / 2;

    const closestX =
        Math.max(
            -halfWidth,
            Math.min(
                localX,
                halfWidth
            )
        );

    const closestZ =
        Math.max(
            -halfDepth,
            Math.min(
                localZ,
                halfDepth
            )
        );

    const distanceX =
        localX -
        closestX;

    const distanceZ =
        localZ -
        closestZ;

    return (
        distanceX * distanceX +
        distanceZ * distanceZ
    ) <=
    radius * radius;
}

function canMoveTo(
    x,
    z,
    radius
) {

    if (
        x < -WORLD_SIZE + 2 ||
        x > WORLD_SIZE - 2 ||
        z < -WORLD_SIZE + 2 ||
        z > WORLD_SIZE - 2
    ) {
        return false;
    }

    for (
        const obstacle of obstacles
    ) {

        if (
            circleIntersectsRotatedBox(
                x,
                z,
                radius,
                obstacle
            )
        ) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   DIRECCIÓN DE CÁMARA
========================================================= */

function getForward() {

    const direction =
        new THREE.Vector3(
            -Math.sin(cameraYaw),
            0,
            -Math.cos(cameraYaw)
        );

    direction.normalize();

    return direction;
}


/* =========================================================
   MOVIMIENTO
========================================================= */

function updatePlayerMovement(
    delta
) {

    if (!gameRunning) {
        return;
    }

    const length =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );

    if (length < .01) {
        return;
    }

    const forward =
        getForward();

    const right =
        new THREE.Vector3(
            Math.cos(cameraYaw),
            0,
            -Math.sin(cameraYaw)
        );

    const direction =
        new THREE.Vector3();

    direction
        .addScaledVector(
            forward,
            moveY
        )
        .addScaledVector(
            right,
            moveX
        );

    direction.normalize();

    const speed =
        8.5;

    const distance =
        speed * delta;

    const nextX =
        player.position.x +
        direction.x *
        distance;

    const nextZ =
        player.position.z +
        direction.z *
        distance;

    /*
        Se prueba X y Z por separado.
        Esto permite "deslizarse" por las paredes
        en lugar de quedarse completamente atrapado.
    */

    if (
        canMoveTo(
            nextX,
            player.position.z,
            player.userData.radius
        )
    ) {

        player.position.x =
            nextX;
    }

    if (
        canMoveTo(
            player.position.x,
            nextZ,
            player.userData.radius
        )
    ) {

        player.position.z =
            nextZ;
    }

    const targetRotation =
        Math.atan2(
            direction.x,
            direction.z
        );

    player.rotation.y =
        smoothAngle(
            player.rotation.y,
            targetRotation,
            Math.min(
                1,
                delta * 10
            )
        );
}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(
    delta
) {

    const target =
        new THREE.Vector3(
            player.position.x,
            1.5,
            player.position.z
        );

    const distance =
        6.3;

    const horizontal =
        Math.cos(
            cameraPitch
        ) * distance;

    const offset =
        new THREE.Vector3(
            Math.sin(cameraYaw) *
            horizontal,

            Math.sin(cameraPitch) *
            distance +
            2.3,

            Math.cos(cameraYaw) *
            horizontal
        );

    const desired =
        target.clone()
            .add(offset);

    camera.position.lerp(
        desired,
        Math.min(
            1,
            delta * 7
        )
    );

    camera.lookAt(
        target
    );
}

function smoothAngle(
    a,
    b,
    amount
) {

    let difference =
        b - a;

    while (
        difference > Math.PI
    ) {
        difference -=
            Math.PI * 2;
    }

    while (
        difference < -Math.PI
    ) {
        difference +=
            Math.PI * 2;
    }

    return a +
        difference *
        amount;
}

/* =========================================================
   BALAS DEL JUGADOR
========================================================= */

function updatePlayerBullets(
    delta
) {

    for (
        let i =
            playerBullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            playerBullets[i];

        bullet.mesh.position
            .addScaledVector(
                bullet.velocity,
                delta
            );

        bullet.life -=
            delta;

        let remove =
            bullet.life <= 0;

        if (
            bullet.mesh.position.x <
                -WORLD_SIZE ||
            bullet.mesh.position.x >
                WORLD_SIZE ||
            bullet.mesh.position.z <
                -WORLD_SIZE ||
            bullet.mesh.position.z >
                WORLD_SIZE
        ) {

            remove = true;
        }

        for (
            let e =
                enemies.length - 1;
            e >= 0 && !remove;
            e--
        ) {

            const enemy =
                enemies[e];

            const distance =
                bullet.mesh.position
                    .distanceTo(
                        enemy.position
                    );

            if (
                distance <
                1.15
            ) {

                enemy.userData.health -=
                    35;

                enemy.userData.flash =
                    .1;

                createImpactParticles(
                    bullet.mesh.position,
                    0xff5b42
                );

                playImpactSound();

                remove = true;

                if (
                    enemy.userData.health <=
                    0
                ) {

                    killEnemy(
                        enemy
                    );
                }
            }
        }

        if (remove) {

            scene.remove(
                bullet.mesh
            );

            bullet.mesh.geometry.dispose();
            bullet.mesh.material.dispose();

            playerBullets.splice(
                i,
                1
            );
        }
    }
}

/* =========================================================
   IA ENEMIGA
========================================================= */

function updateEnemies(
    delta
) {

    for (
        const enemy of enemies
    ) {

        const dx =
            player.position.x -
            enemy.position.x;

        const dz =
            player.position.z -
            enemy.position.z;

        const distance =
            Math.sqrt(
                dx * dx +
                dz * dz
            );

        const direction =
            new THREE.Vector3(
                dx,
                0,
                dz
            );

        if (
            direction.lengthSq() >
            .001
        ) {

            direction.normalize();
        }

        /*
            MOVIMIENTO HACIA EL JUGADOR
        */

        if (
            distance > 8
        ) {

            const nextX =
                enemy.position.x +
                direction.x *
                enemy.userData.speed *
                delta;

            const nextZ =
                enemy.position.z +
                direction.z *
                enemy.userData.speed *
                delta;

            if (
                canMoveTo(
                    nextX,
                    enemy.position.z,
                    enemy.userData.radius
                )
            ) {

                enemy.position.x =
                    nextX;
            }

            if (
                canMoveTo(
                    enemy.position.x,
                    nextZ,
                    enemy.userData.radius
                )
            ) {

                enemy.position.z =
                    nextZ;
            }

        } else {

            /*
                CUANDO ESTÁ CERCA,
                SE MUEVE LATERALMENTE
            */

            const strafe =
                new THREE.Vector3(
                    -direction.z,
                    0,
                    direction.x
                );

            const nextX =
                enemy.position.x +
                strafe.x *
                enemy.userData.strafe *
                .65 *
                delta;

            const nextZ =
                enemy.position.z +
                strafe.z *
                enemy.userData.strafe *
                .65 *
                delta;

            if (
                canMoveTo(
                    nextX,
                    nextZ,
                    enemy.userData.radius
                )
            ) {

                enemy.position.x =
                    nextX;

                enemy.position.z =
                    nextZ;
            }
        }

        /*
            GIRAR HACIA EL JUGADOR
        */

        const targetRotation =
            Math.atan2(
                direction.x,
                direction.z
            );

        enemy.rotation.y =
            smoothAngle(
                enemy.rotation.y,
                targetRotation,
                Math.min(
                    1,
                    delta * 6
                )
            );

        /*
            DISPARAR
        */

        enemy.userData.shootTimer -=
            delta;

        if (
            enemy.userData.shootTimer <= 0 &&
            distance < 35
        ) {

            enemy.userData.shootTimer =
                1.0 +
                Math.random() *
                1.5;

            enemyShoot(
                enemy
            );
        }

        if (
            enemy.userData.flash > 0
        ) {

            enemy.userData.flash -=
                delta;

            enemy.traverse(
                child => {

                    if (
                        child.isMesh &&
                        child.material &&
                        child.material.emissive
                    ) {

                        child.material.emissiveIntensity =
                            2.8;
                    }
                }
            );

        } else {

            enemy.traverse(
                child => {

                    if (
                        child.isMesh &&
                        child.material &&
                        child.material.emissive
                    ) {

                        child.material.emissiveIntensity =
                            child.material.color.r >
                            .5
                                ? .8
                                : 0;
                    }
                }
            );
        }
    }
}


/* =========================================================
   DISPARO ENEMIGO
========================================================= */

function enemyShoot(
    enemy
) {

    if (!gameRunning) {
        return;
    }

    resumeAudio();

    playEnemyShot();

    enemy.userData.muzzle
        .intensity = 18;

    setTimeout(
        () => {

            if (
                enemy.userData.muzzle
            ) {

                enemy.userData.muzzle
                    .intensity = 0;
            }

        },
        55
    );

    const start =
        enemy.position.clone();

    start.y =
        1.6;

    const direction =
        player.position.clone()
            .sub(start);

    direction.y =
        .15;

    direction.normalize();

    createMuzzleFlash(
        enemy.position,
        direction,
        0xff3044
    );

    const geometry =
        new THREE.SphereGeometry(
            .085,
            6,
            6
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xff314c
        });

    const bullet =
        new THREE.Mesh(
            geometry,
            material
        );

    bullet.position.copy(
        start
    );

    scene.add(
        bullet
    );

    enemyBullets.push({
        mesh: bullet,
        velocity:
            direction.clone()
                .multiplyScalar(23),
        life: 2.5
    });
}


/* =========================================================
   BALAS ENEMIGAS
========================================================= */

function updateEnemyBullets(
    delta
) {

    for (
        let i =
            enemyBullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            enemyBullets[i];

        bullet.mesh.position
            .addScaledVector(
                bullet.velocity,
                delta
            );

        bullet.life -=
            delta;

        let remove =
            bullet.life <= 0;

        const distance =
            bullet.mesh.position
                .distanceTo(
                    player.position
                );

        if (
            distance <
            1.0
        ) {

            damagePlayer(
                8 +
                Math.random() *
                7
            );

            createImpactParticles(
                bullet.mesh.position,
                0xff3045
            );

            remove = true;
        }

        if (remove) {

            scene.remove(
                bullet.mesh
            );

            bullet.mesh.geometry.dispose();
            bullet.mesh.material.dispose();

            enemyBullets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DAÑO AL JUGADOR
========================================================= */

let playerDamageCooldown = 0;

function damagePlayer(
    amount
) {

    if (
        !gameRunning ||
        playerDamageCooldown > 0
    ) {
        return;
    }

    playerDamageCooldown =
        .25;

    playerHealth =
        Math.max(
            0,
            playerHealth -
            amount
        );

    playDamageSound();

    damageFlash.classList.remove(
        "hit"
    );

    void damageFlash.offsetWidth;

    damageFlash.classList.add(
        "hit"
    );

    updateHealthUI();

    if (
        playerHealth <= 0
    ) {

        endGame();
    }
}

function updateHealthUI() {

    const value =
        Math.round(
            playerHealth
        );

    healthText.textContent =
        value + "%";

    healthFill.style.width =
        value + "%";

    if (
        value > 60
    ) {

        healthFill.style.background =
            "linear-gradient(90deg,#19e88a,#baff5e)";

    } else if (
        value > 30
    ) {

        healthFill.style.background =
            "linear-gradient(90deg,#ffd43b,#ff9f1c)";

    } else {

        healthFill.style.background =
            "linear-gradient(90deg,#ff2424,#ff693b)";
    }
}


/* =========================================================
   MUERTE ENEMIGA
========================================================= */

function killEnemy(
    enemy
) {

    const index =
        enemies.indexOf(
            enemy
        );

    if (
        index === -1
    ) {
        return;
    }

    kills++;

    killsText.textContent =
        kills;

    playDeathSound();

    createExplosion(
        enemy.position.clone()
            .setY(1.3)
    );

    scene.remove(
        enemy
    );

    enemies.splice(
        index,
        1
    );

    /*
        CADA 10 ELIMINACIONES
        SUBE LA OLEADA
    */

    const newWave =
        Math.floor(
            kills / 10
        ) + 1;

    if (
        newWave > wave
    ) {

        wave =
            newWave;

        waveIndicator.textContent =
            "OLEADA " + wave;

        showMessage(
            "OLEADA " + wave
        );
    }
}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createImpactParticles(
    position,
    color
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const geometry =
            new THREE.SphereGeometry(
                .025 +
                Math.random() *
                .045,
                4,
                4
            );

        const material =
            new THREE.MeshBasicMaterial({
                color
            });

        const particle =
            new THREE.Mesh(
                geometry,
                material
            );

        particle.position.copy(
            position
        );

        const velocity =
            new THREE.Vector3(
                (Math.random() - .5) *
                    5,

                Math.random() *
                    4,

                (Math.random() - .5) *
                    5
            );

        scene.add(
            particle
        );

        particles.push({
            mesh: particle,
            velocity,
            life:
                .25 +
                Math.random() *
                .35
        });
    }
}

function createExplosion(
    position
) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const geometry =
            new THREE.SphereGeometry(
                .035 +
                Math.random() *
                .06,
                4,
                4
            );

        const material =
            new THREE.MeshBasicMaterial({
                color:
                    Math.random() >
                    .4
                        ? 0xff392f
                        : 0xffc34a
            });

        const particle =
            new THREE.Mesh(
                geometry,
                material
            );

        particle.position.copy(
            position
        );

        const velocity =
            new THREE.Vector3(
                (Math.random() - .5) *
                    7,

                Math.random() *
                    6,

                (Math.random() - .5) *
                    7
            );

        scene.add(
            particle
        );

        particles.push({
            mesh: particle,
            velocity,
            life:
                .45 +
                Math.random() *
                .45
        });
    }
}

function updateParticles(
    delta
) {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.mesh.position
            .addScaledVector(
                particle.velocity,
                delta
            );

        particle.velocity.y -=
            10 *
            delta;

        particle.life -=
            delta;

        particle.mesh.scale
            .setScalar(
                Math.max(
                    0,
                    particle.life *
                    2
                )
            );

        if (
            particle.life <= 0
        ) {

            scene.remove(
                particle.mesh
            );

            particle.mesh.geometry.dispose();
            particle.mesh.material.dispose();

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   EFECTOS
========================================================= */

function updateEffects(
    delta
) {

    for (
        let i =
            effects.length - 1;
        i >= 0;
        i--
    ) {

        const effect =
            effects[i];

        effect.life -=
            delta;

        const scale =
            Math.max(
                0,
                effect.life /
                .08
            );

        effect.mesh.scale
            .setScalar(
                scale * 1.7
            );

        effect.mesh.material.opacity =
            scale;

        if (
            effect.life <= 0
        ) {

            scene.remove(
                effect.mesh
            );

            effect.mesh.geometry.dispose();
            effect.mesh.material.dispose();

            effects.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   SPAWN
========================================================= */

function updateSpawning(
    delta
) {

    enemySpawnTimer -=
        delta;

    const maxEnemies =
        Math.min(
            5 +
            wave *
            2,
            20
        );

    if (
        enemySpawnTimer <= 0 &&
        enemies.length <
            maxEnemies
    ) {

        spawnEnemy();

        enemySpawnTimer =
            Math.max(
                .45,
                1.65 -
                wave *
                .07
            ) +
            Math.random() *
            .65;
    }
}


/* =========================================================
   MENSAJES
========================================================= */

function showMessage(
    text
) {

    message.textContent =
        text;

    message.style.opacity =
        "1";

    setTimeout(
        () => {

            message.style.opacity =
                "0";

        },
        1100
    );
}


/* =========================================================
   REINICIAR
========================================================= */

function resetGame() {

    for (
        const enemy of enemies
    ) {

        scene.remove(
            enemy
        );
    }

    for (
        const bullet of playerBullets
    ) {

        scene.remove(
            bullet.mesh
        );
    }

    for (
        const bullet of enemyBullets
    ) {

        scene.remove(
            bullet.mesh
        );
    }

    for (
        const particle of particles
    ) {

        scene.remove(
            particle.mesh
        );
    }

    for (
        const effect of effects
    ) {

        scene.remove(
            effect.mesh
        );
    }

    enemies.length = 0;
    playerBullets.length = 0;
    enemyBullets.length = 0;
    particles.length = 0;
    effects.length = 0;

    player.position.set(
        0,
        0,
        12
    );

    player.rotation.set(
        0,
        0,
        0
    );

    cameraYaw =
        Math.PI;

    cameraPitch =
        .28;

    playerHealth =
        100;

    kills =
        0;

    wave =
        1;

    shootCooldown =
        0;

    playerDamageCooldown =
        0;

    enemySpawnTimer =
        .3;

    moveX =
        0;

    moveY =
        0;

    killsText.textContent =
        "0";

    waveIndicator.textContent =
        "OLEADA 1";

    joystickKnob.style.transform =
        "translate(0px,0px)";

    updateHealthUI();
}


/* =========================================================
   INICIAR
========================================================= */

function startGame() {

    initializeAudio();
    resumeAudio();

    if (!renderer) {

        initializeRenderer();
        initializeScene();
    }

    resetGame();

    splash.classList.add(
        "hidden"
    );

    hud.style.display =
        "block";

    gameOver.style.display =
        "none";

    gameRunning =
        true;

    gameStarted =
        true;

    clock.start();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning =
        false;

    playPlayerDeathSound();

    finalKills.textContent =
        kills;

    gameOver.style.display =
        "flex";
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );

    if (!renderer) {
        return;
    }

    const delta =
        Math.min(
            clock.getDelta(),
            .033
        );

    if (gameRunning) {

        shootCooldown =
            Math.max(
                0,
                shootCooldown -
                delta
            );

        playerDamageCooldown =
            Math.max(
                0,
                playerDamageCooldown -
                delta
            );

        updatePlayerMovement(
            delta
        );

        updateCamera(
            delta
        );

        updateSpawning(
            delta
        );

        updateEnemies(
            delta
        );

        updatePlayerBullets(
            delta
        );

        updateEnemyBullets(
            delta
        );

        updateParticles(
            delta
        );

        updateEffects(
            delta
        );
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   JOYSTICK
========================================================= */

function setupJoystick() {

    joystick.addEventListener(
        "pointerdown",
        event => {

            if (!gameRunning) {
                return;
            }

            joystickPointerId =
                event.pointerId;

            joystick.setPointerCapture(
                event.pointerId
            );

            updateJoystick(
                event.clientX,
                event.clientY
            );
        }
    );

    joystick.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerId !==
                joystickPointerId
            ) {
                return;
            }

            updateJoystick(
                event.clientX,
                event.clientY
            );
        }
    );

    joystick.addEventListener(
        "pointerup",
        releaseJoystick
    );

    joystick.addEventListener(
        "pointercancel",
        releaseJoystick
    );
}

function updateJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x -
        centerX;

    let dy =
        y -
        centerY;

    const max =
        rect.width *
        .30;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        distance >
        max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;
    }

    moveX =
        dx /
        max;

    moveY =
        -dy /
        max;

    joystickKnob.style.transform =
        `translate(${dx}px,${dy}px)`;
}

function releaseJoystick(
    event
) {

    if (
        event.pointerId !==
        joystickPointerId
    ) {
        return;
    }

    joystickPointerId =
        null;

    moveX =
        0;

    moveY =
        0;

    joystickKnob.style.transform =
        "translate(0px,0px)";
}


/* =========================================================
   CONTROL DE CÁMARA TÁCTIL
========================================================= */

function setupLookControls() {

    lookArea.addEventListener(
        "pointerdown",
        event => {

            if (!gameRunning) {
                return;
            }

            lookPointerId =
                event.pointerId;

            lookLastX =
                event.clientX;

            lookLastY =
                event.clientY;

            lookArea.setPointerCapture(
                event.pointerId
            );
        }
    );

    lookArea.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerId !==
                lookPointerId
            ) {
                return;
            }

            const dx =
                event.clientX -
                lookLastX;

            const dy =
                event.clientY -
                lookLastY;

            lookLastX =
                event.clientX;

            lookLastY =
                event.clientY;

            cameraYaw -=
                dx *
                .006;

            cameraPitch +=
                dy *
                .004;

            cameraPitch =
                THREE.MathUtils.clamp(
                    cameraPitch,
                    .05,
                    .72
                );
        }
    );

    lookArea.addEventListener(
        "pointerup",
        () => {

            lookPointerId =
                null;
        }
    );

    lookArea.addEventListener(
        "pointercancel",
        () => {

            lookPointerId =
                null;
        }
    );
}


/* =========================================================
   BOTÓN DE DISPARO
========================================================= */

function setupFireButton() {

    fireButton.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            if (!gameRunning) {
                return;
            }

            shootPlayer();
        }
    );
}


/* =========================================================
   TECLADO PARA PC
========================================================= */

function setupKeyboard() {

    const keys = {};

    window.addEventListener(
        "keydown",
        event => {

            keys[event.code] =
                true;

            if (
                event.code ===
                "Space"
            ) {

                shootPlayer();
            }

            updateKeyboard(
                keys
            );
        }
    );

    window.addEventListener(
        "keyup",
        event => {

            keys[event.code] =
                false;

            updateKeyboard(
                keys
            );
        }
    );
}

function updateKeyboard(
    keys
) {

    let x = 0;
    let y = 0;

    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {
        x -= 1;
    }

    if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {
        x += 1;
    }

    if (
        keys["KeyW"] ||
        keys["ArrowUp"]
    ) {
        y += 1;
    }

    if (
        keys["KeyS"] ||
        keys["ArrowDown"]
    ) {
        y -= 1;
    }

    const length =
        Math.sqrt(
            x * x +
            y * y
        );

    if (
        length > 0
    ) {

        moveX =
            x / length;

        moveY =
            y / length;

    } else {

        moveX =
            0;

        moveY =
            0;
    }
}


/* =========================================================
   EVENTOS
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    () => {

        initializeAudio();
        resumeAudio();

        resetGame();

        gameOver.style.display =
            "none";

        gameRunning =
            true;

        clock.start();
    }
);

window.addEventListener(
    "resize",
    () => {

        if (
            !renderer ||
            !camera
        ) {
            return;
        }

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight,
            false
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );
    }
);

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);

setupJoystick();
setupLookControls();
setupFireButton();
setupKeyboard();

</script>
