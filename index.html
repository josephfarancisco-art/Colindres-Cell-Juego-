<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colindres Cell GAME - Color sin Límites</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Montserrat', sans-serif; color: white; width: 100vw; height: 100vh; }

        #game-container { position: relative; width: 100%; height: 100%; background: #050b14; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Capas y Pantallas */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 10, 25, 0.96); z-index: 100; transition: opacity 0.3s; }
        .hidden { display: none !important; }

        /* HUD Superior */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; pointer-events: auto; z-index: 10; }
        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; width: 150px; }
        
        .bar-bg { background: rgba(0,0,0,0.8); border: 2px solid #00f3ff; border-radius: 10px; height: 18px; overflow: hidden; box-shadow: 0 0 8px #00f3ff; }
        .bar-fill { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; text-shadow: 1px 1px 2px black; transition: width 0.1s; }
        .hp { background: linear-gradient(90deg, #ff0000, #ff4d4d); width: 100%; }
        .mp { background: linear-gradient(90deg, #0055ff, #0099ff); width: 80%; }
        .boss-hp { background: linear-gradient(90deg, #ff0000, #ff8c00); width: 100%; }
        .coins { font-size: 12px; font-weight: bold; color: #ffcc00; margin-top: 2px; }

        .hud-center { text-align: center; text-shadow: 0 0 10px #00f3ff; flex-grow: 1; padding: 0 5px; }
        .hud-center h2 { font-size: 14px; color: #00f3ff; letter-spacing: 1px; }
        .hud-center span { font-size: 9px; opacity: 0.8; }
        .boss-info { font-size: 9px; font-weight: bold; color: #ff4d4d; text-align: right; }

        /* Panel de Habilidades */
        .skills-panel { position: absolute; left: 10px; top: 35%; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; z-index: 10; }
        .btn-skill { width: 45px; height: 45px; background: rgba(0, 20, 50, 0.85); border: 2px solid #00f3ff; color: white; border-radius: 8px; font-size: 8px; font-weight: bold; box-shadow: inset 0 0 10px #00f3ff; cursor: pointer; text-align: center; }

        /* Controles Táctiles */
        .touch-controls { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: auto; z-index: 10; }
        .joystick-container { width: 110px; height: 110px; background: rgba(255,255,255,0.08); border: 2px solid rgba(0, 243, 255, 0.4); border-radius: 50%; position: relative; touch-action: none; }
        .joystick-knob { width: 50px; height: 50px; background: rgba(0, 243, 255, 0.4); border: 2px solid #00f3ff; border-radius: 50%; position: absolute; top: 30px; left: 30px; pointer-events: none; transition: transform 0.05s linear; }

        .action-buttons { display: flex; gap: 12px; align-items: flex-end; }
        .btn-action { width: 65px; height: 65px; border-radius: 50%; background: rgba(0, 15, 30, 0.85); border: 2px solid #00f3ff; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(0,243,255,0.3); }

        .bottom-bar { position: absolute; bottom: 3px; width: 100%; text-align: center; color: #00f3ff; font-style: italic; font-weight: 900; font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 10; }

        /* Menús y Estilos Pro */
        .menu-box { background: linear-gradient(180deg, rgba(0,30,80,0.95) 0%, rgba(0,10,30,0.95) 100%); border: 3px solid #00f3ff; padding: 25px 20px; border-radius: 20px; text-align: center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); width: 90%; max-width: 420px; }
        .menu-box h1 { font-size: 1.8rem; color: #fff; text-shadow: 0 0 15px #00f3ff; margin-bottom: 5px; }
        .menu-box h2 { font-size: 0.9rem; color: #ffcc00; margin-bottom: 15px; }
        
        .btn-menu { display: block; width: 100%; padding: 12px; margin: 8px 0; background: linear-gradient(90deg, #ffcc00, #ffaa00); border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 10px rgba(255,204,0,0.4); }
        .btn-menu:active { transform: scale(0.97); }

        /* Cuadrícula de Niveles (10 Niveles) */
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .level-card { background: rgba(0,20,50,0.9); border: 2px solid #00f3ff; border-radius: 8px; padding: 10px 5px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; }
        .level-card.locked { opacity: 0.4; border-color: #555; cursor: not-allowed; }
        .level-card span { display: block; font-size: 10px; color: #ffcc00; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD DE JUEGO -->
        <div id="ui-layer" class="hidden">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="bar-bg"><div class="bar-fill hp" id="hp-bar">100/100</div></div>
                    <div class="bar-bg"><div class="bar-fill mp" id="mp-bar">80/100</div></div>
                    <div class="coins">💰 <span id="coin-display">2,450</span></div>
                </div>
                <div class="hud-center">
                    <h2 id="level-title-hud">NIVEL 1</h2>
                    <span>Soluciones móviles a tu alcance</span>
                </div>
                <div class="hud-right">
                    <div class="boss-info" id="boss-hud-label">ENEMIGOS RESTANTES</div>
                    <div class="bar-bg"><div class="bar-fill boss-hp" id="boss-hp-bar" style="width: 100%;"></div></div>
                </div>
            </div>

            <div class="skills-panel">
                <button class="btn-skill" onclick="SFX.special()">Katana</button>
                <button class="btn-skill" onclick="SFX.special()">Especial</button>
                <button class="btn-skill" onclick="SFX.defend()">Defensa</button>
                <button class="btn-skill" onclick="player.heal()">Poción</button>
            </div>
            
            <div class="touch-controls">
                <div class="joystick-container" id="joystickZone">
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>
                <div class="action-buttons">
                    <button class="btn-action" id="btn-jump">⬆️</button>
                    <button class="btn-action" id="btn-attack">⚔️</button>
                </div>
            </div>
            <div class="bottom-bar">COLOR SIN LÍMITES 👑</div>
        </div>

        <!-- PANTALLA DE TÍTULO -->
        <div id="screen-title" class="screen">
            <div class="menu-box">
                <h1>Colindres Cell</h1>
                <h2>GAME - Color sin Límites 👑</h2>
                <button class="btn-menu" id="btn-play">▶ JUGAR</button>
                <button class="btn-menu" id="btn-goto-levels">★ 10 NIVELES</button>
                <button class="btn-menu" onclick="alert('Tienda exclusiva Colindres Cell: ¡Mejora tus katanas pronto!')">🛒 TIENDA</button>
                <button class="btn-menu" onclick="alert('Versión 2.0 Pro - Desarrollado para GitHub Pages')">⚙️ AJUSTES</button>
            </div>
        </div>

        <!-- PANTALLA DE SELECCIÓN DE NIVELES (10 NIVELES) -->
        <div id="screen-levels" class="screen hidden">
            <div class="menu-box" style="max-width: 480px;">
                <h1>SELECCIONA NIVEL</h1>
                <h2>10 Desafíos de Dificultad Extrema</h2>
                <div class="level-grid" id="levelGridContainer"></div>
                <button class="btn-menu" id="btn-back-title" style="background: #555; color: white; margin-top: 10px;">❮ Volver</button>
            </div>
        </div>

        <!-- PANTALLA DE VICTORIA / DERROTA -->
        <div id="screen-end" class="screen hidden">
            <div class="menu-box">
                <h1 id="end-title" style="color: #ffcc00;">VICTORIA 👑</h1>
                <p id="end-message" style="margin: 10px 0; font-size: 0.9rem;">¡Has superado el nivel con éxito!</p>
                <button class="btn-menu" id="btn-next-level">SIGUIENTE NIVEL ▶</button>
                <button class="btn-menu" id="btn-menu-back" style="background: #444; color: white;">MENÚ PRINCIPAL</button>
            </div>
        </div>
    </div>

    <script>
        // --- MOTOR DE AUDIO SINTETIZADO (SFX "MACIZO") ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const SFX = {
            playTone(freq, type, duration, vol = 0.1) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            sword() {
                this.playTone(600, 'sawtooth', 0.15, 0.15);
                setTimeout(() => this.playTone(300, 'triangle', 0.1, 0.1), 50);
            },
            jump() {
                this.playTone(250, 'sine', 0.2, 0.1);
            },
            hit() {
                this.playTone(120, 'square', 0.2, 0.2);
            },
            win() {
                [300, 400, 500, 700].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.15), i * 150);
                });
            },
            special() {
                this.playTone(800, 'sawtooth', 0.3, 0.15);
            },
            defend() {
                this.playTone(180, 'sine', 0.2, 0.2);
            }
        };

        // --- CONFIGURACIÓN DEL JUEGO Y CANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'TITLE'; // TITLE, LEVELS, PLAYING, END
        let currentLevel = 1;
        let maxUnlockedLevel = 1;
        let coins = 2450;
        const input = { left: false, right: false };

        // --- CLASE JUGADOR ---
        class Player {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = 80;
                this.y = canvas.height - 220;
                this.width = 60;
                this.height = 95;
                this.vx = 0;
                this.vy = 0;
                this.speed = 5;
                this.gravity = 0.8;
                this.isJumping = false;
                this.isAttacking = false;
                this.hp = 100;
                this.maxHp = 100;
                this.mp = 80;
            }
            update() {
                if (input.left) this.vx = -this.speed;
                else if (input.right) this.vx = this.speed;
                else this.vx = 0;

                this.x += this.vx;
                if (this.x < 10) this.x = 10;
                if (this.x > canvas.width - 100) this.x = canvas.width - 100;

                this.y += this.vy;
                const floor = canvas.height - 180;
                if (this.y < floor) {
                    this.vy += this.gravity;
                } else {
                    this.y = floor;
                    this.isJumping = false;
                    this.vy = 0;
                }
            }
            draw(ctx) {
                // Dibujo del personaje (Chaqueta azul Colindres Cell)
                ctx.fillStyle = '#0055ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Pelo rizado y gafas estilizadas
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x + 8, this.y + 6, 44, 22);
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(this.x + 35, this.y + 14, 15, 8); // Gafas

                // Animación de Corte de Katana Azul
                if (this.isAttacking) {
                    ctx.fillStyle = 'rgba(0, 243, 255, 0.9)';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width + 25, this.y + 45, 55, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            attack() {
                if (!this.isAttacking) {
                    this.isAttacking = true;
                    SFX.sword();
                    
                    // Colisión con enemigos
                    enemies.forEach(en => {
                        let dist = Math.abs((this.x + 50) - (en.x + en.width / 2));
                        if (dist < 90 && Math.abs(this.y - en.y) < 50) {
                            en.hp -= 50;
                            SFX.hit();
                            if (en.hp <= 0) en.dead = true;
                        }
                    });

                    setTimeout(() => this.isAttacking = false, 250);
                }
            }
            jump() {
                if (!this.isJumping) {
                    this.vy = -14;
                    this.isJumping = true;
                    SFX.jump();
                }
            }
            heal() {
                if (coins >= 50 && this.hp < this.maxHp) {
                    coins -= 50;
                    this.hp = Math.min(this.maxHp, this.hp + 40);
                    document.getElementById('coin-display').innerText = coins;
                    SFX.special();
                }
            }
        }

        // --- CLASE ENEMIGO / SÚPER CARGADOR ---
        class Enemy {
            constructor(x, y, isBoss = false, level = 1) {
                this.x = x;
                this.y = y;
                this.isBoss = isBoss;
                this.width = isBoss ? 110 : 65;
                this.height = isBoss ? 140 : 85;
                this.hp = isBoss ? (100 + level * 50) : (40 + level * 15);
                this.maxHp = this.hp;
                this.speed = 1 + level * 0.2;
                this.dir = -1;
                this.dead = false;
            }
            update(player) {
                // IA Básica: patrullar y atacar al jugador si está cerca
                this.x += this.speed * this.dir;
                if (this.x < canvas.width / 2) this.dir = 1;
                if (this.x > canvas.width - 150) this.dir = -1;

                // Daño al jugador por contacto
                let dist = Math.abs(this.x - player.x);
                if (dist < 40 && Math.abs(this.y - player.y) < 40) {
                    if (Math.random() < 0.05) {
                        player.hp -= (this.isBoss ? 15 : 8);
                        SFX.hit();
                        if (player.hp <= 0) gameOver();
                    }
                }
            }
            draw(ctx) {
                if (this.isBoss) {
                    // Súper Cargador Boss
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = '#ff0000'; // Ojos láser
                    ctx.fillRect(this.x + 20, this.y + 35, 22, 16);
                    ctx.fillRect(this.x + 68, this.y + 35, 22, 16);
                    // Pines del enchufe arriba
                    ctx.fillStyle = '#888';
                    ctx.fillRect(this.x + 30, this.y - 20, 15, 20);
                    ctx.fillRect(this.x + 65, this.y - 20, 15, 20);
                } else {
                    // Enemigo menor (Robot candado/cargador)
                    ctx.fillStyle = '#333b52';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(this.x + 18, this.y + 25, 12, 10);
                    ctx.fillRect(this.x + 35, this.y + 25, 12, 10);
                }
            }
        }

        const player = new Player();
        let enemies = [];

        // --- GESTIÓN DE NIVELES (10 NIVELES) ---
        function initLevel(lvl) {
            currentLevel = lvl;
            player.reset();
            enemies = [];

            let enemyCount = 1 + Math.floor(lvl / 1.5);
            let hasBoss = lvl >= 5 || lvl === 10;

            for (let i = 0; i < enemyCount; i++) {
                let ex = canvas.width - 200 - (i * 90);
                let ey = canvas.height - 180 - (i % 2 === 0 ? 0 : 20);
                enemies.push(new Enemy(ex, ey, false, lvl));
            }

            if (hasBoss) {
                enemies.push(new Enemy(canvas.width - 250, canvas.height - 320, true, lvl));
            }

            document.getElementById('level-title-hud').innerText = `NIVEL ${lvl}`;
            document.getElementById('boss-hud-label').innerText = hasBoss ? "BOSS FINAL ACTIVO" : "ENEMIGOS";
            document.getElementById('hp-bar').style.width = '100%';
            document.getElementById('hp-bar').innerText = '100/100';
        }

        function buildLevelSelector() {
            const container = document.getElementById('levelGridContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                let card = document.createElement('div');
                let isLocked = i > maxUnlockedLevel;
                card.className = `level-card ${isLocked ? 'locked' : ''}`;
                card.innerHTML = `Nivel ${i}<span>${i === 10 ? '👑 BOSS' : '★ ' + i}</span>`;
                if (!isLocked) {
                    card.onclick = () => {
                        initLevel(i);
                        document.getElementById('screen-levels').classList.add('hidden');
                        document.getElementById('ui-layer').classList.remove('hidden');
                        gameState = 'PLAYING';
                    };
                }
                container.appendChild(card);
            }
        }

        function gameOver() {
            gameState = 'END';
            SFX.hit();
            document.getElementById('end-title').innerText = "DERROTA 💀";
            document.getElementById('end-message').innerText = `Te derrotaron en el Nivel ${currentLevel}. ¡Inténtalo de nuevo!`;
            document.getElementById('btn-next-level').style.display = 'none';
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('screen-end').classList.remove('hidden');
        }

        function levelWin() {
            gameState = 'END';
            SFX.win();
            coins += 300;
            document.getElementById('coin-display').innerText = coins;
            if (currentLevel < 10 && currentLevel >= maxUnlockedLevel) {
                maxUnlockedLevel = currentLevel + 1;
            }
            document.getElementById('end-title').innerText = "COLINDRES CELL WIN 👑";
            document.getElementById('end-message').innerText = `¡Nivel ${currentLevel} superado! Monedas ganadas: 300`;
            document.getElementById('btn-next-level').style.display = 'block';
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('screen-end').classList.remove('hidden');
        }

        // --- BUCLE PRINCIPAL DEL JUEGO ---
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'PLAYING') {
                // Fondo urbano nocturno estilizado
                ctx.fillStyle = '#050b14';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Suelo con neón
                ctx.fillStyle = '#0d1b2a';
                ctx.fillRect(0, canvas.height - 180, canvas.width, 180);
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(0, canvas.height - 180, canvas.width, 4);

                player.update();
                player.draw(ctx);

                // Actualizar y dibujar enemigos
                let aliveCount = 0;
                let bossHpPercent = 100;
                
                enemies.forEach(en => {
                    if (!en.dead) {
                        aliveCount++;
                        en.update(player);
                        en.draw(ctx);
                        if (en.isBoss) {
                            bossHpPercent = Math.max(0, (en.hp / en.maxHp) * 100);
                        }
                    }
                });

                // Actualizar barras HUD
                document.getElementById('hp-bar').style.width = `${Math.max(0, player.hp)}%`;
                document.getElementById('hp-bar').innerText = `${Math.max(0, player.hp)}/100`;
                document.getElementById('boss-hp-bar').style.width = `${bossHpPercent}%`;

                // Verificar victoria del nivel
                if (aliveCount === 0) {
                    levelWin();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // --- EVENTOS UI Y TÁCTILES ---
        document.getElementById('btn-play').addEventListener('click', () => {
            initLevel(1);
            document.getElementById('screen-title').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            gameState = 'PLAYING';
        });

        document.getElementById('btn-goto-levels').addEventListener('click', () => {
            buildLevelSelector();
            document.getElementById('screen-title').classList.add('hidden');
            document.getElementById('screen-levels').classList.remove('hidden');
        });

        document.getElementById('btn-back-title').addEventListener('click', () => {
            document.getElementById('screen-levels').classList.add('hidden');
            document.getElementById('screen-title').classList.remove('hidden');
        });

        document.getElementById('btn-next-level').addEventListener('click', () => {
            document.getElementById('screen-end').classList.add('hidden');
            if (currentLevel < 10) {
                initLevel(currentLevel + 1);
                document.getElementById('ui-layer').classList.remove('hidden');
                gameState = 'PLAYING';
            } else {
                document.getElementById('screen-title').classList.remove('hidden');
            }
        });

        document.getElementById('btn-menu-back').addEventListener('click', () => {
            document.getElementById('screen-end').classList.add('hidden');
            document.getElementById('screen-title').classList.remove('hidden');
        });

        // Controles de Ataque y Salto
        const btnAttack = document.getElementById('btn-attack');
        const btnJump = document.getElementById('btn-jump');

        btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); player.attack(); });
        btnAttack.addEventListener('mousedown', () => player.attack());

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); player.jump(); });
        btnJump.addEventListener('mousedown', () => player.jump());

        // Joystick Táctil Lógico
        const zone = document.getElementById('joystickZone');
        const knob = document.getElementById('joystickKnob');
        let joystickTouchId = null;
        let centerX = 0, centerY = 0;

        zone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = zone.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
        }, {passive: false});

        zone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let maxRadius = 35;

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                    }

                    knob.style.transform = `translate(${dx}px, ${dy}px)`;

                    if (dx < -10) { input.left = true; input.right = false; }
                    else if (dx > 10) { input.right = true; input.left = false; }
                    else { input.left = false; input.right = false; }
                }
            }
        }, {passive: false});

        function resetJoystick() {
            joystickTouchId = null;
            knob.style.transform = `translate(0px, 0px)`;
            input.left = false;
            input.right = false;
        }

        zone.addEventListener('touchend', resetJoystick);
        zone.addEventListener('touchcancel', resetJoystick);

        document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
